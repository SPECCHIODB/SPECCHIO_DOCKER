events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    upstream glassfish_cluster {
        # Points directly to the webapp service name defined in docker-compose
        server webapp:8080;
    }

    server {
        # Catch-all listeners for HTTP (Localhost / Internal IPs)
        listen 80 default_server;
        listen [::]:80 default_server;

        # Catch-all listeners for HTTPS (Public Internet URL Traffic)
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        # Wildcard routing for any incoming hostname/IP address
        server_name _;

        # Provide paths for SSL certificates. 
        # (For local use, these can point to generic/blank dummy files. 
        # For public use, point these to real Let's Encrypt keys mounted via a volume)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Enable modern secure TLS parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Allow large file transfers (important for DB dump transfers via web interface)
        client_max_body_size 100M;

        location / {
            proxy_pass http://glassfish_cluster;

            # Inject proxy routing metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CRUCIAL: Pass the scheme the user *originally* connected with.
            # For public HTTPS connections, this sends "https", satisfying GlassFish security checks.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure session cookie pathing maps correctly between containers
            proxy_cookie_path / /;
        }
    }
}