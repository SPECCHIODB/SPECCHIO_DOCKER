events { 
    worker_connections 1024; 
}


# HTTP Traffic
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    upstream glassfish_cluster {
        server webapp:8080;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        
        server_name specchio.duckdns.org www.specchio.duckdns.org;

        # for lets encrypt certbot validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # rest gors to https
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Traffic
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name specchio.duckdns.org www.specchio.duckdns.org;

        # Paths for Lets Encrypt
        ssl_certificate     /etc/letsencrypt/live/specchio.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/specchio.duckdns.org/privkey.pem;

        # Optimize TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # SSL-Session-Caching
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Add Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 100M;

        location / {
            proxy_pass http://glassfish_cluster;

            # Proxy-Metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # unsure if needed for Glassfish
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_cookie_path / /;
        }
    }
}